# Supabase ücretsiz planı, bir hafta az kullanılan projeyi duraklatır (hac/umre dönemleri arasında olabilir).
# Bu iş 3 günde bir sunucuya küçük bir okuma isteği atar. SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY yoksa bir şey yapmaz.
name: Supabase uyanık tut
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Okuma isteği
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Sunucu tanımlı değil, atlandı."; exit 0; fi
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 "$URL/rest/v1/reports?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"; head -c 300 body.txt; echo
          case "$code" in 2*) ;; *) echo "::warning::Supabase yanıtı $code (proje duraklatılmış olabilir: Dashboard → Resume project)"; exit 1;; esac
