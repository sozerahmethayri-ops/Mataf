# Telefona kurulabilir Android APK'sı: her main gönderiminde ya da "Run workflow" ile GitHub'ın
# sunucularında derlenir. Sonuç: Actions → bu çalışma → "mataf-apk" ve Releases → "apk-latest".
# APK, Expo şablonundaki hata ayıklama anahtarıyla imzalıdır (yan yükleme için; Play Store için kendi
# anahtarınızla imzalayın). Google Haritalar anahtarı isteğe bağlı: depo Secrets → GOOGLE_MAPS_API_KEY.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # Aile/grup konumu ve canlı kapı bildirimleri (gizli değerler yoksa uygulama önizleme moduyla çalışır)
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm run check
      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install
      - name: APK derle
        working-directory: android
        # R8 küçültme kapalı: açıkken WorkManager/Room sınıfları siliniyor ve uygulama açılışta çöküyordu
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.enableMinifyInReleaseBuilds=false
      - name: APK'yı adlandır
        id: name
        run: |
          V=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "mataf-$V.apk"
          # Sabit adlı kopya: paylaşılan indirme bağlantısı her sürümde en yeni APK'yı verir
          cp android/app/build/outputs/apk/release/app-release.apk mataf.apk
          # Uygulamadaki güncelleme uyarısı bu dosyaya bakar (APK'larla aynı adımda, en son yüklenir)
          C=$(node -p "require('./app.json').expo.android.versionCode")
          node -e "require('fs').writeFileSync('version.json', JSON.stringify({ version: process.argv[1], versionCode: Number(process.argv[2]), apk: 'https://github.com/sozerahmethayri-ops/Mataf/releases/download/apk-latest/mataf.apk', at: new Date().toISOString() }))" "$V" "$C"
          echo "file=mataf-$V.apk" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mataf-apk
          path: ${{ steps.name.outputs.file }}
      - name: Sürüm sayfasına koy (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MATAF ${{ steps.name.outputs.version }} (APK)
          body: Telefona kurulabilir Android APK'sı. İndirip açın; "bilinmeyen kaynaklardan yükleme" izni istenirse verin.
          prerelease: true
          files: |
            ${{ steps.name.outputs.file }}
            mataf.apk
            version.json
