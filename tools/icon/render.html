<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const S = 2048;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(S, S);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Rastgele ama tekrarlanabilir
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// Örtü (kisve): siyah, ince dokulu, hafif desenli kumaş
function kiswahTex() {
  const [c, g] = canvas(1024, 1024);
  g.fillStyle = '#050506'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${0.012 + rnd() * 0.02})`; g.fillRect(rnd() * 1024, rnd() * 1024, 1, 6 + rnd() * 18); }
  g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 3;
  for (let y = 40; y < 1024; y += 120) for (let x = 0; x < 1024; x += 160) { g.beginPath(); g.ellipse(x + 80, y, 64, 26, 0, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(x, y + 60); g.quadraticCurveTo(x + 80, y + 20, x + 160, y + 60); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); t.anisotropy = 8; return t;
}

// Altın kuşak (hizâm): yazı yerine soyut süsleme (madalyonlar, kıvrımlar, kenar çizgileri)
function bandTex() {
  const [c, g] = canvas(4096, 256);
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#9a7024'); gr.addColorStop(0.15, '#f2d37c'); gr.addColorStop(0.5, '#ffe9a8'); gr.addColorStop(0.85, '#e2b85a'); gr.addColorStop(1, '#8c6420');
  g.fillStyle = gr; g.fillRect(0, 0, 4096, 256);
  g.fillStyle = 'rgba(60,40,8,0.85)'; g.fillRect(0, 26, 4096, 6); g.fillRect(0, 224, 4096, 6);
  g.strokeStyle = 'rgba(70,46,10,0.75)'; g.lineWidth = 9; g.lineCap = 'round';
  for (let x = 0; x < 4096; x += 340) {
    g.beginPath(); g.moveTo(x + 10, 150); g.bezierCurveTo(x + 70, 60, x + 130, 200, x + 190, 110); g.bezierCurveTo(x + 230, 60, x + 290, 190, x + 330, 120); g.stroke();
    g.beginPath(); g.ellipse(x + 100, 128, 18, 30, 0.4, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(x + 230, 70); g.lineTo(x + 236, 190); g.stroke();
    g.beginPath(); g.moveTo(x + 260, 64); g.quadraticCurveTo(x + 280, 150, x + 300, 190); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// Kapı örtüsü (sitâre) ve kapı: altın çerçeveli, geometrik bölmeli
function doorTex() {
  const [c, g] = canvas(512, 900);
  const gr = g.createLinearGradient(0, 0, 512, 900); gr.addColorStop(0, '#ffe7a0'); gr.addColorStop(0.45, '#d9a94a'); gr.addColorStop(1, '#f6d684');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 900);
  g.strokeStyle = 'rgba(70,46,10,0.8)'; g.lineWidth = 10; g.strokeRect(20, 20, 472, 860);
  g.lineWidth = 6;
  for (let r = 0; r < 5; r++) { const y = 60 + r * 160; g.strokeRect(60, y, 392, 132); g.beginPath(); g.ellipse(256, y + 66, 120, 40, 0, 0, Math.PI * 2); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// Ölçüler (m): Kâbe ~12 × 11, yükseklik ~13
const W = 12, D = 11, H = 13.1;
const kiswah = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: kiswahTex(), roughness: 0.7, metalness: 0, sheen: 0.25, sheenRoughness: 0.6, sheenColor: new THREE.Color(0x202022) });
const gold = (map) => new THREE.MeshStandardMaterial({ color: 0xffffff, map, metalness: 0.9, roughness: 0.27, envMapIntensity: 1.6 });
const marble = new THREE.MeshStandardMaterial({ color: 0xf1ebe1, roughness: 0.38, metalness: 0 });

const kaaba = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), kiswah); body.position.y = H / 2 + 0.3; body.castShadow = true; body.receiveShadow = true; kaaba.add(body);
// Kuşak: dört yüze ayrı şerit (doku her yüzde düz akar)
const band = bandTex(); const bandMat = gold(band);
const BH = 1.35, BY = 9.1;
const faces = [[W, 0, D / 2 + 0.02, 0], [W, 0, -D / 2 - 0.02, Math.PI], [D, W / 2 + 0.02, 0, Math.PI / 2], [D, -W / 2 - 0.02, 0, -Math.PI / 2]];
for (const [len, x, z, ry] of faces) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len + 0.04, BH), bandMat); m.position.set(x, BY, z); m.rotation.y = ry; kaaba.add(m);
}
// Kapı: ön yüzde, doğu köşesine yakın, yerden ~2,2 m yukarıda
const door = new THREE.Mesh(new THREE.BoxGeometry(2.1, 3.8, 0.12), gold(doorTex())); door.position.set(W / 2 - 3.4, 2.2 + 0.3 + 3.8 / 2, D / 2 + 0.07); door.castShadow = true; kaaba.add(door);
// Şâzervan: mermer etek
const base = new THREE.Mesh(new THREE.BoxGeometry(W + 0.7, 0.32, D + 0.7), marble); base.position.y = 0.16; base.castShadow = true; base.receiveShadow = true; kaaba.add(base);
scene.add(kaaba);

// Zemin: kenara doğru saydamlaşan mermer daire
const [ac, ag] = canvas(512, 512);
const rg = ag.createRadialGradient(256, 256, 60, 256, 256, 256); rg.addColorStop(0, '#fff'); rg.addColorStop(0.62, '#fff'); rg.addColorStop(1, '#000');
ag.fillStyle = rg; ag.fillRect(0, 0, 512, 512);
const groundMat = new THREE.MeshStandardMaterial({ color: 0xf6f1e9, roughness: 0.35, metalness: 0, transparent: true, alphaMap: new THREE.CanvasTexture(ac) });
const ground = new THREE.Mesh(new THREE.CircleGeometry(15, 96), groundMat); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// Işık: sol üstten sıcak güneş, arkadan kenar ışığı, gökyüzü dolgu
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x8c6a48, 0.55));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.6); sun.position.set(-26, 34, 30); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 6; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 }); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffd29a, 1.3); rim.position.set(30, 18, -30); scene.add(rim);

const cam = new THREE.PerspectiveCamera(30, 1, 1, 400);
cam.position.set(24, 11.5, 40); cam.lookAt(0, 6.6, 0);

function shot() { renderer.render(scene, cam); return renderer.domElement.toDataURL('image/png'); }
window.renders = {};
window.renders.full = shot();
// Tek renk (siluet): beyaz gövde, siyah kuşak/kapı/süsler, zemin yok
ground.visible = false; scene.environment = null;
const white = new THREE.MeshBasicMaterial({ color: 0xffffff }), black = new THREE.MeshBasicMaterial({ color: 0x000000 });
kaaba.traverse((o) => { if (o.isMesh) o.material = o === body || o === base ? white : black; });
renderer.toneMapping = THREE.NoToneMapping;
window.renders.mono = shot();
window.done = true;
</script></body></html>
